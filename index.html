<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSRIT Canteen</title>
<meta name="theme-color" content="#1B1033">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Baloo+2:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --f-bg:#F7F8F6; --f-ink:#121A17; --f-primary:#1C6B4F;
    --s-bg:#1B1033; --s-ink:#FFF6EA; --s-hot:#FF3E6C; --s-sun:#FFC737; --s-mint:#33E6B8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  .split { display: flex; height: 100vh; min-height: 560px; }
  @media (max-width: 760px) { .split { flex-direction: column; height: auto; min-height: auto; } }

  .panel {
    flex: 1; position: relative; display: flex; flex-direction: column;
    justify-content: center; padding: 48px; overflow: hidden; cursor: pointer;
    border: none; text-align: left; transition: flex .35s ease;
  }
  @media (max-width: 760px) { .panel { min-height: 50vh; padding: 36px 28px; } }
  .panel:hover, .panel:focus-visible { flex: 1.12; }
  @media (max-width: 760px) { .panel:hover, .panel:focus-visible { flex: 1; } }

  /* ---- Faculty half: calm ---- */
  .panel-faculty {
    background: var(--f-bg); color: var(--f-ink);
    clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
  }
  @media (max-width: 760px) {
    .panel-faculty { clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%); }
  }
  .panel-faculty .eyebrow { color: var(--f-primary); }
  .panel-faculty h2 { font-size: clamp(32px, 5vw, 52px); font-weight: 700; margin: 10px 0 14px; letter-spacing: -0.02em; }
  .panel-faculty p { color: #4B5A53; max-width: 36ch; line-height: 1.55; margin: 0 0 24px; }
  .panel-faculty .cta {
    background: var(--f-primary); color: #fff; border: none; padding: 13px 22px;
    border-radius: 8px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .panel-faculty .cta:hover { background: #124B37; }
  .f-icon-row { display: flex; gap: 10px; margin-bottom: 18px; color: #7C8C84; font-size: 13px; }
  .f-icon-row span { border: 1px solid #DCE3DE; border-radius: 999px; padding: 5px 12px; }

  /* ---- Student half: loud ---- */
  .panel-student {
    background:
      radial-gradient(circle at 18% 112%, rgba(255,62,108,.45), transparent 45%),
      radial-gradient(circle at 85% -10%, rgba(51,230,184,.35), transparent 40%),
      var(--s-bg);
    color: var(--s-ink);
  }
  .panel-student::before {
    content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.14) 1.4px, transparent 1.4px);
    background-size: 15px 15px;
  }
  .panel-student .sticker {
    position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px;
    background: var(--s-sun); color: #2A1400; font-family: 'Manrope', sans-serif; font-weight: 700;
    font-size: 13px; padding: 6px 14px; border-radius: 999px; transform: rotate(-4deg);
    width: fit-content; margin-bottom: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .panel-student .pulse { width: 7px; height: 7px; border-radius: 50%; background: #2A1400; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .panel-student h2 {
    position: relative; z-index: 1; font-family: 'Baloo 2', sans-serif; font-weight: 800;
    font-size: clamp(38px, 6.5vw, 64px); line-height: .98; margin: 0 0 16px; letter-spacing: -0.01em;
  }
  .panel-student h2 em { font-style: normal; color: var(--s-sun); }
  .panel-student p {
    position: relative; z-index: 1; font-family: 'Manrope', sans-serif; color: #D8CBFA;
    max-width: 34ch; line-height: 1.55; margin: 0 0 26px;
  }
  .panel-student .cta {
    position: relative; z-index: 1; background: var(--s-hot); color: #fff; border: 3px solid var(--s-ink);
    padding: 13px 24px; border-radius: 999px; font-family: 'Manrope', sans-serif; font-weight: 700;
    font-size: 15px; cursor: pointer; transform: rotate(-1.5deg);
    box-shadow: 4px 4px 0 var(--s-ink);
  }
  .panel-student .cta:hover { transform: rotate(0deg) translate(-2px,-2px); box-shadow: 6px 6px 0 var(--s-ink); }

  .divider-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-90deg);
    font-family: 'Manrope', sans-serif; font-size: 11px; letter-spacing: .14em; color: #8A94A0;
    background: #0E0820; padding: 6px 10px; border-radius: 999px; z-index: 2; white-space: nowrap;
  }
  @media (max-width: 760px) { .divider-label { transform: translate(-50%,-50%); top: 50%; } }

  .remembered {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: #0E0820; color: #fff; font-family: 'Manrope', sans-serif; font-size: 13px;
    padding: 9px 16px; border-radius: 999px; z-index: 3; display: none; align-items: center; gap: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  .remembered a { color: var(--s-sun); font-weight: 700; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>

<div class="split">
  <button class="panel panel-faculty" onclick="choose('faculty')" aria-label="Continue as Faculty">
    <div class="f-icon-row"><span>Pre-order</span><span>Priority pickup</span><span>Wallet</span></div>
    <div class="eyebrow" style="font-size:13px;font-weight:600">MSRIT Canteen</div>
    <h2>Faculty Portal</h2>
    <p>Order ahead, skip the queue, pick up at Faculty Counter #3. Built to be quick and out of your way.</p>
    <span class="cta">Continue as Faculty</span>
  </button>

  <button class="panel panel-student" onclick="choose('student')" aria-label="Continue as Student">
    <span class="sticker"><span class="pulse"></span> Live queue: 12 waiting</span>
    <h2>MSRIT<br><em>Canteen</em></h2>
    <p>Order, vote on today's food, climb the streak leaderboard. Skip the line without skipping the chaos.</p>
    <span class="cta">I'm a Student →</span>
  </button>

  <div class="divider-label">choose your portal</div>
</div>

<div class="remembered" id="rememberedBar"></div>

<script>
  function choose(role) {
    localStorage.setItem('msrit_role', role);
    window.location.href = role === 'faculty' ? 'faculty/index.html' : 'student/index.html';
  }
  (function () {
    const last = localStorage.getItem('msrit_role');
    if (!last) return;
    const bar = document.getElementById('rememberedBar');
    const label = last === 'faculty' ? 'Faculty' : 'Student';
    const href = last === 'faculty' ? 'faculty/index.html' : 'student/index.html';
    bar.innerHTML = `Last time you used <b>${label}</b> &nbsp;·&nbsp; <a href="${href}">Jump back in</a>`;
    bar.style.display = 'flex';
  })();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
</script>
</body>
</html>
